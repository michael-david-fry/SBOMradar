[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bomradar"
version = "0.1.0"
description = "SBOM vulnerability scanner powered by ProjectDiscovery vulnx"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "SBOMradar contributors" }]
dependencies = [
  "jinja2>=3.1.0",
  "pydantic>=2.6.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
bomradar = "bomradar.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
